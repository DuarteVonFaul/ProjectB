<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtus · Prólogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0604;color:#e9d8b4;font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden}
#wrap{position:relative;width:100vw;height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:1280px;height:720px;position:relative;flex:none;overflow:hidden;perspective:2400px;
  background:radial-gradient(ellipse at 50% 46%,#3d2817 0%,#22150c 50%,#0c0705 100%)}
#glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 12%,rgba(255,170,80,.22),transparent 45%),radial-gradient(circle at 50% 55%,rgba(255,190,110,.10),transparent 60%)}
#book{position:absolute;left:200px;top:60px;width:880px;height:600px;transform-style:preserve-3d}
#base{position:absolute;left:-14px;top:-10px;width:908px;height:624px;border-radius:7px;
  background:#4a2414 linear-gradient(90deg,#3a1a0e 0%,#5a2c18 48%,#2a1209 50%,#5a2c18 52%,#3a1a0e 100%);
  box-shadow:0 34px 70px rgba(0,0,0,.7),inset 0 0 26px rgba(0,0,0,.6)}
#pages{position:absolute;inset:0;transform-style:preserve-3d}
.pg{position:absolute;top:0;width:440px;height:600px;overflow:hidden;
  background-color:#e7d3aa;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .36 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
   radial-gradient(circle at 78% 22%,rgba(150,100,40,.16),transparent 22%),
   radial-gradient(circle at 25% 80%,rgba(140,90,40,.14),transparent 26%)}
.pg.l{left:0}
.pg.r{left:440px}
.pg.l::after,.pg.r::after{content:'';position:absolute;inset:0;pointer-events:none}
.pg.l::after{background:linear-gradient(90deg,rgba(90,55,20,.30) 0%,transparent 7%,transparent 86%,rgba(70,40,15,.45) 100%)}
.pg.r::after{background:linear-gradient(270deg,rgba(90,55,20,.30) 0%,transparent 7%,transparent 86%,rgba(70,40,15,.45) 100%)}
.pg svg{position:absolute;inset:0;display:block}
#leaf{position:absolute;left:440px;top:0;width:440px;height:600px;transform-origin:0 50%;transform-style:preserve-3d;display:none;z-index:5}
#cover{position:absolute;left:440px;top:0;width:440px;height:600px;transform-origin:0 50%;transform-style:preserve-3d;z-index:6}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;left:0!important}
.face.back{transform:rotateY(180deg)}
.cvf{border-radius:3px 9px 9px 3px;background:#5a2a16 radial-gradient(circle at 40% 35%,#6e3620,#3e1b0d 75%);
  box-shadow:inset 0 0 0 10px #4a2111,inset 0 0 0 12px #b4842c,inset 0 0 0 18px #4a2111,inset 0 0 0 19px #8a6322,inset 0 0 40px rgba(0,0,0,.7);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#d4a64a}
.cvt{font-family:'IM Fell English SC',serif;font-size:68px;letter-spacing:10px;text-shadow:0 2px 0 #2a1208,0 0 18px rgba(212,166,74,.25)}
.cvs{font-family:'IM Fell English SC',serif;font-size:20px;letter-spacing:4px;color:#c29440}
#char{position:absolute;inset:0;display:none;pointer-events:none;z-index:8}
.hd{padding:40px 44px 0;text-align:center;color:#5a3a1e}
.ch{font-family:'IM Fell English SC',serif;font-size:15px;letter-spacing:3px}
.sc{font-family:'IM Fell English SC',serif;font-size:30px;color:#7a2a14;margin-top:2px}
.orn{font-size:20px;color:#9a6a2a;line-height:1}
.txt{padding:10px 46px;font-size:21px;line-height:1.42;color:#3a2313;text-align:justify;hyphens:auto}
.txt p{margin:0 0 9px}
.txt span{color:rgba(58,35,19,.15);transition:color .35s}
.txt span.on{color:#3a2313}
.txt p:first-child::first-letter{font-family:'IM Fell English SC',serif;font-size:56px;float:left;line-height:.88;margin:5px 8px 0 0;color:#7a2a14}
.splat{transform-box:fill-box;transform-origin:center;animation:splat .45s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes splat{from{transform:scale(0)}}
.drip{transform-box:fill-box;transform-origin:top;animation:drip 2.4s ease-in backwards}
@keyframes drip{from{transform:scaleY(0)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:20}
#cap{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-style:italic;font-size:34px;color:#f0dcb0;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .6s;z-index:25;pointer-events:none}
#end{position:absolute;left:0;right:0;top:668px;text-align:center;font-family:'IM Fell English SC',serif;font-size:34px;letter-spacing:6px;color:#d4a64a;text-shadow:0 0 24px rgba(212,166,74,.35);opacity:0;transition:opacity 2.5s;z-index:25;pointer-events:none}
#intro{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:60px;background:linear-gradient(transparent 55%,rgba(0,0,0,.75))}
#intro button{font-family:'IM Fell English SC',serif;font-size:26px;letter-spacing:2px;padding:12px 34px;border-radius:8px;border:1px solid #b4842c;background:rgba(40,20,10,.85);color:#e9c77a;cursor:pointer}
#intro button:hover{background:rgba(70,35,15,.95)}
#intro p{margin:12px 0 0;font-size:17px;color:#bfa77c}
#ui{height:56px;display:flex;align-items:center;justify-content:center;gap:14px;background:#120b07;border-top:1px solid #3a2516;font-size:15px;flex-wrap:wrap;padding:0 12px}
#ui button,#ui select{font:inherit;font-size:15px;background:#24160d;color:#e9d8b4;border:1px solid #5a3b22;border-radius:6px;padding:5px 12px;cursor:pointer}
#ui label{display:flex;align-items:center;gap:6px;color:#bfa77c}
#ui select#selVoice{max-width:230px}
</style>
</head>
<body>
<div id="wrap">
 <div id="stage">
  <div id="glow"></div>
  <div id="book">
   <div id="base"></div>
   <div id="pages">
    <div id="L" class="pg l"></div>
    <div id="R" class="pg r"></div>
    <div id="leaf"><div id="leafF" class="face pg r"></div><div id="leafB" class="face back pg l"></div></div>
    <div id="char"></div>
   </div>
   <div id="cover">
    <div class="face cvf">
     <div class="cvt">VIRTUS</div>
     <svg width="150" height="150" viewBox="-75 -75 150 150"><g fill="none" stroke="#c99a3e" stroke-width="2"><circle cx="0" cy="-18" r="30"/><circle cx="-18" cy="12" r="30"/><circle cx="18" cy="12" r="30"/><circle r="62" stroke-width="1.2"/></g><path d="M0,-14 L10,2 L0,18 L-10,2Z" fill="#7fd0de" stroke="#c99a3e" stroke-width="1.5"/></svg>
     <div class="cvs">Prólogo · Capítulo 0</div>
    </div>
    <div id="coverB" class="face back pg l"></div>
   </div>
  </div>
  <canvas id="fx" width="1280" height="720"></canvas>
  <div id="cap"></div>
  <div id="end">Fim do Prólogo</div>
  <div id="intro"><button id="bIntro">▶ Assistir ao Prólogo</button><p>Ligue o som · narração por voz do navegador</p></div>
 </div>
</div>
<div id="ui">
 <button id="bStart">▶ Assistir</button>
 <select id="selScene"></select>
 <button id="bStop">■ Parar</button>
 <label>Música <input type="range" id="vol" min="0" max="1" step="0.05" value="0.7"></label>
 <label><input type="checkbox" id="chkV" checked> Narração</label>
 <select id="selVoice" title="Voz do narrador"></select>
</div>

<script>
/* ============ utilidades ============ */
const $=id=>document.getElementById(id);
const stage=$('stage'),book=$('book'),base=$('base'),pages=$('pages'),L=$('L'),R=$('R'),leaf=$('leaf'),leafF=$('leafF'),leafB=$('leafB'),cover=$('cover'),coverB=$('coverB'),charEl=$('char'),capEl=$('cap'),endEl=$('end'),glow=$('glow');
function fit(){const w=$('wrap');const s=Math.min(w.clientWidth/1280,w.clientHeight/720);stage.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
const CANCEL={cancel:true};let TOK={stopped:true};
const guard=p=>{const t=TOK;return Promise.resolve(p).then(v=>{if(t.stopped)throw CANCEL;return v},e=>{if(t.stopped)throw CANCEL;throw e})};
const wait=ms=>guard(new Promise(r=>setTimeout(r,ms)));
function rng(seed){let a=seed*9973+12345;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ROM=['','I','II','III','IV','V','VI','VII','VIII','IX'];
const header=n=>`<div class="hd"><div class="ch">Prólogo · Capítulo 0</div><div class="sc">Cena ${ROM[n]}</div><div class="orn">❦</div></div><div class="txt"></div>`;

/* ============ desenho (SVG em traço de tinta) ============ */
const INK='#3a2313',GOLD='#b4842c',BLOOD='#6d0a0a',FIG='#dcc69a',DARK='#24150c',WHITE='#f1e4c6';
const st=(w,c=INK)=>`stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
const f1=n=>(+n).toFixed(1);
function frame(){return `<rect x="16" y="16" width="408" height="568" fill="none" ${st(1.4)}/><rect x="23" y="23" width="394" height="554" fill="none" ${st(.6)}/>`+
 [[16,16],[424,16],[16,584],[424,584]].map(([x,y])=>`<path d="M${x-6},${y} L${x},${y-6} L${x+6},${y} L${x},${y+6}Z" fill="${INK}" ${st(.6)}/>`).join('')}
const divider=y=>`<path d="M40,${y} L205,${y} M235,${y} L400,${y}" fill="none" ${st(.8)}/><path d="M220,${y-7} L227,${y} L220,${y+7} L213,${y}Z" fill="${GOLD}" ${st(.8)}/>`;
function ground(y,x1=30,x2=410){let d=`M${x1},${y} Q${(x1+x2)/2},${y-6} ${x2},${y}`;for(let x=x1+12;x<x2;x+=22)d+=` M${x},${y+5} l-7,6`;return `<path d="${d}" fill="none" ${st(.9)}/>`}
const star=(x,y,r,c=GOLD)=>`<path d="M${f1(x)},${f1(y-r)} Q${f1(x+r*.18)},${f1(y-r*.18)} ${f1(x+r)},${f1(y)} Q${f1(x+r*.18)},${f1(y+r*.18)} ${f1(x)},${f1(y+r)} Q${f1(x-r*.18)},${f1(y+r*.18)} ${f1(x-r)},${f1(y)} Q${f1(x-r*.18)},${f1(y-r*.18)} ${f1(x)},${f1(y-r)}Z" fill="${c}" stroke="${c}" stroke-width=".5"/>`;
function stars(seed,n,a){const r=rng(seed);let g='';for(let i=0;i<n;i++)g+=star(a[0]+r()*(a[2]-a[0]),a[1]+r()*(a[3]-a[1]),3+r()*5);return g}
function ether(x1,y1,x2,y2,seed,n){const r=rng(seed);let g='';for(let i=0;i<n;i++){const y=y1+(y2-y1)*(i+.5)/n;g+=`<path d="M${x1},${f1(y)} C${f1(x1+(x2-x1)*.3)},${f1(y-40+r()*80)} ${f1(x1+(x2-x1)*.7)},${f1(y-40+r()*80)} ${x2},${f1(y+r()*24-12)}" fill="none" stroke="${GOLD}" stroke-width="${f1(.7+r()*1.1)}" stroke-opacity=".6"/>`}return g}
function lightning(x1,y1,x2,y2,seed){const r=rng(seed);let d=`M${x1},${y1}`;const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len;for(let i=1;i<7;i++){const k=i/7,j=(r()-.5)*22;d+=` L${f1(x1+dx*k+nx*j)},${f1(y1+dy*k+ny*j)}`}d+=` L${x2},${y2}`;return `<path d="${d}" fill="none" ${st(2.2,GOLD)}/><path d="${d}" fill="none" ${st(.7,'#fff3cf')}/>`}
const heartP=(x,y,z)=>`<circle cx="${x}" cy="${y}" r="${14*z}" fill="${GOLD}" fill-opacity=".28" stroke="none"><animate attributeName="r" values="${12*z};${19*z};${12*z}" dur="1.4s" repeatCount="indefinite"/></circle><path d="M${x},${y+7*z} C${x-13*z},${y-z} ${x-9*z},${y-12*z} ${x},${y-5*z} C${x+9*z},${y-12*z} ${x+13*z},${y-z} ${x},${y+7*z}Z" fill="#a51b1b" ${st(.8)}/>`;

function person(o){
 const {x,y,h=100,pose='stand',flip=false,fill=FIG,horns=true,belly=false,hair=false,halo=false,t=0,evil=false,run=false,kneel=false,dead=false,crown=false,op=1}=o;
 const s=h/100,q=Math.sqrt(s),W=w=>st(f1(w/q*10)/10,INK),k=kneel?18:0;
 const legs=kneel?'M-5,-12 L-13,-1 L-27,-1 M5,-12 L18,-14 L18,0':run?'M-6,-30 L-18,-14 L-26,-4 M6,-30 L12,-14 L20,0':'M-6,-30 L-8,0 M6,-30 L8,0';
 const A={stand:[[-14,-58,-15,-44],[14,-58,15,-44]],power:[[-18,-88,-24,-104],[18,-88,24,-104]],fight:[[-16,-62,-10,-52],[22,-78,34,-88]],
  hold:[[-14,-62,0,-58],[14,-62,4,-56]],raise:[[10,-86,22,-100],[16,-84,28,-98]],belly:[[-14,-58,-15,-44],[16,-58,10,-50]],
  heart:[[-14,-62,-2,-58],[18,-64,30,-70]],chest:[[-14,-58,-15,-44],[22-6*t,-62,36-33*t,-76+12*t]],dead:[[-16,-60,-24,-48],[16,-64,26,-56]]};
 const arms=(A[pose]||A.stand).map(([ex,ey,hx,hy],i)=>`M${i?9:-9},-74 L${f1(ex)},${f1(ey)} L${f1(hx)},${f1(hy)}`).join(' ');
 const bundle=(bx,by)=>`<ellipse cx="${bx}" cy="${by}" rx="10" ry="6" fill="${WHITE}" ${W(1.3)}/><circle cx="${bx-8}" cy="${by-2}" r="4" fill="${FIG}" ${W(1.2)}/>`;
 let ex='';
 if(pose==='power')ex=[-24,24].map(px=>`<circle cx="${px}" cy="-106" r="6" fill="${GOLD}" fill-opacity=".55" ${W(1)}/>`+[0,1,2,3,4,5].map(j=>{const a=j*Math.PI/3;return `<path d="M${f1(px+Math.cos(a)*9)},${f1(-106+Math.sin(a)*9)} L${f1(px+Math.cos(a)*14)},${f1(-106+Math.sin(a)*14)}" fill="none" ${st(f1(1/q),GOLD)}/>`}).join('')).join('');
 if(pose==='fight')ex=`<path d="M8,-58 L62,-114" fill="none" ${W(2)}/><path d="M62,-114 L55,-103 L66,-106Z" fill="${INK}" ${W(1)}/><ellipse cx="-13" cy="-55" rx="6" ry="13" fill="${fill}" ${W(1.4)}/>`;
 if(pose==='hold')ex=bundle(4,-60);
 if(pose==='raise')ex=bundle(30,-101);
 if(pose==='heart')ex=bundle(-2,-60)+heartP(34,-72,1);
 if(pose==='chest'&&t>=1)ex=`<circle cx="3" cy="-63" r="3.5" fill="${BLOOD}"/>`;
 let g=`<path d="${legs}" fill="none" ${W(3)}/><g transform="translate(0,${k})">`;
 g+=`<path d="M-9,-76 Q0,-79 9,-76 L15,-30 L-15,-30Z" fill="${fill}" ${W(1.6)}/>`;
 if(belly)g+=`<path d="M7,-62 Q28,-50 13,-31" fill="${fill}" ${W(1.6)}/>`;
 g+=`<path d="M-13,-44 L13,-44" fill="none" ${W(1)}/><path d="${arms}" fill="none" ${W(3)}/>`;
 g+=`<circle cx="0" cy="-88" r="9" fill="${fill}" ${W(1.6)}/>`;
 if(hair)g+=`<path d="M-9,-90 Q-10,-100 0,-99 Q10,-100 9,-90 Q14,-72 10,-62 M-9,-90 Q-14,-72 -10,-62" fill="none" ${W(1.4)}/>`;
 if(horns)g+=`<path d="M-5,-95 Q-14,-101 -10,-113 M5,-95 Q14,-101 10,-113" fill="none" ${W(1.6)}/>`;
 if(crown)g+=`<path d="M-8,-95 L-10,-108 L-4,-100 L0,-111 L4,-100 L10,-108 L8,-95Z" fill="${GOLD}" ${W(1)}/>`;
 const ec=evil?'#d01a10':INK;
 g+=`<circle cx="-3" cy="-89" r="1.3" fill="${ec}"/><circle cx="3" cy="-89" r="1.3" fill="${ec}"/>`;
 if(evil)g+=`<circle cx="-3" cy="-89" r="3.5" fill="#ff3020" fill-opacity=".35"/><circle cx="3" cy="-89" r="3.5" fill="#ff3020" fill-opacity=".35"/>`;
 if(halo)g+=`<ellipse cx="0" cy="-104" rx="11" ry="3" fill="none" ${st(f1(1.8/q),GOLD)}/>`;
 g+=ex+'</g>';
 const tr=dead?`translate(${x},${f1(y-14*s)}) rotate(${flip?90:-90}) scale(${s})`:`translate(${x},${y}) scale(${flip?-s:s},${s})`;
 return `<g transform="${tr}" opacity="${op}">${g}</g>`;
}
function god(o){
 const {x,y,h=200,v=0,shadow=false,ghost=false}=o;const s=h/100,q=Math.sqrt(s),sc=ghost?GOLD:INK,W=w=>st(f1(w/q*10)/10,sc);
 const f=ghost?'none':shadow?DARK:WHITE;let g='';
 if(v===1){const wing=`<path d="M-10,-72 Q-48,-112 -66,-66 Q-50,-74 -42,-56 Q-34,-66 -22,-52Z" fill="${ghost?'none':shadow?DARK:'#e9d6ad'}" ${W(1.3)}/><path d="M-20,-70 Q-40,-90 -52,-72 M-24,-62 Q-38,-76 -46,-64" fill="none" ${W(.8)}/>`;g+=wing+`<g transform="scale(-1,1)">${wing}</g>`}
 if(!shadow&&!ghost)for(let j=0;j<16;j++){const a=j*Math.PI/8,r2=j%2?30:36;g+=`<path d="M${f1(Math.cos(a)*22)},${f1(-92+Math.sin(a)*22)} L${f1(Math.cos(a)*r2)},${f1(-92+Math.sin(a)*r2)}" fill="none" ${st(f1(1/q),GOLD)}/>`}
 g+=`<circle cx="0" cy="-92" r="17" fill="none" ${st(f1(2/q),GOLD)} ${shadow?'stroke-dasharray="2 3" opacity=".7"':''}/>`;
 g+=`<path d="M0,-84 Q-16,-80 -20,-50 Q-26,-18 -34,0 L34,0 Q26,-18 20,-50 Q16,-80 0,-84Z" fill="${f}" ${W(1.6)}/>`;
 g+=`<path d="M-6,-62 Q-10,-30 -16,-2 M6,-62 Q10,-30 16,-2 M0,-70 L0,-2" fill="none" ${shadow?st(f1(.7/q),'#5a4030'):W(.7)}/>`;
 g+=`<path d="M-12,-74 Q-28,-64 -40,-74 M12,-74 Q28,-64 40,-74" fill="none" ${W(3)}/>`;
 if(v===2)g+=`<path d="M40,-82 L40,0" fill="none" ${W(2)}/><circle cx="40" cy="-88" r="5" fill="${ghost?'none':GOLD}" ${W(1)}/>`;
 g+=`<circle cx="0" cy="-92" r="9" fill="${f}" ${W(1.6)}/>`;
 if(v===0)g+=`<path d="M-8,-99 L-10,-111 L-4,-103 L0,-114 L4,-103 L10,-111 L8,-99Z" fill="${ghost?'none':GOLD}" ${W(1)}/>`;
 const ec=shadow?'#f2c050':ghost?GOLD:INK;
 g+=`<circle cx="-3" cy="-93" r="1.4" fill="${ec}"/><circle cx="3" cy="-93" r="1.4" fill="${ec}"/>`;
 return `<g transform="translate(${x},${y}) scale(${s})" opacity="${ghost?.42:1}">${g}</g>`;
}
function boatman(o){
 const {x,y,h=200,pose='stand'}=o;const s=h/100,q=Math.sqrt(s),W=w=>st(f1(w/q*10)/10);let g='';
 if(pose==='stand')g+=`<path d="M26,-118 L12,8" fill="none" ${W(2.2)}/><path d="M12,8 Q6,22 10,32 Q18,22 12,8Z" fill="#6b4a2e" ${W(1)}/>`;
 g+=`<path d="M0,-104 Q-16,-102 -17,-84 Q-20,-50 -24,0 L24,0 Q20,-50 17,-84 Q16,-102 0,-104Z" fill="#3b2a1f" ${W(1.6)}/>`;
 g+=`<path d="M-8,-60 Q-10,-30 -14,-2 M8,-60 Q10,-30 14,-2" fill="none" ${st(f1(.8/q),'#6b5040')}/>`;
 g+=`<ellipse cx="0" cy="-86" rx="8" ry="10" fill="#0d0805" ${W(1)}/><circle cx="-3" cy="-87" r="1.5" fill="#8fe0ee"/><circle cx="3" cy="-87" r="1.5" fill="#8fe0ee"/>`;
 const arm=pose==='deny'?'M-12,-74 L-24,-86 L-26,-104 M-26,-104 l-4,-7 M-26,-104 l0,-8 M-26,-104 l4,-7 M12,-74 L26,-66 L40,-66 M38,-67 Q44,-60 49,-68'
  :pose==='take'?'M-12,-74 L-16,-56 L-15,-44 M12,-74 L28,-70 L42,-74 M42,-74 Q46,-70 49,-75':'M-12,-74 L-16,-56 L-15,-44 M12,-74 L20,-60 L19,-50';
 g+=`<path d="${arm}" fill="none" ${st(f1(4.5/q),'#3b2a1f')}/><path d="${arm}" fill="none" ${W(1)}/>`;
 return `<g transform="translate(${x},${y}) scale(${s})">${g}</g>`;
}
function water(x,y,w){let d='';for(let r=0;r<3;r++){const yy=y+r*12,a=x-w/2+r*12;d+=`M${f1(a)},${f1(yy)}`;for(let k=0;k<8;k++)d+=` q${f1(w/16)},-6 ${f1(w/8)},0`;d+=' '}return `<path d="${d}" fill="none" ${st(1)}/>`}

function inkPrep(root,total=2.6){
 const els=[...root.querySelectorAll('path,line,circle,ellipse,rect,polyline,polygon')].filter(e=>!e.closest('.noink')&&!e.closest('defs'));
 const list=[];
 for(const e of els){const cs=getComputedStyle(e);const hasS=cs.stroke!=='none'&&parseFloat(cs.strokeWidth)>0;const dashed=cs.strokeDasharray!=='none';let len=0;
  if(hasS&&!dashed){try{len=e.getTotalLength()}catch(_){}}
  if(len>0){e.style.strokeDasharray=len;e.style.strokeDashoffset=len;if(cs.fill!=='none')e.style.fillOpacity=0;list.push([e,1])}
  else{e.style.opacity=0;list.push([e,0])}}
 return{go(){void root.offsetWidth;const n=list.length||1;list.forEach(([e,k],i)=>{const d=Math.max(.4,total*.45),dl=(i/n)*total*.6;
   if(k){e.style.transition=`stroke-dashoffset ${d}s ease-in-out ${dl}s, fill-opacity ${d*.8}s ease ${dl+d*.5}s`;e.style.strokeDashoffset=0;e.style.fillOpacity=''}
   else{e.style.transition=`opacity ${d}s ease ${dl}s`;e.style.opacity=''}});
  setTimeout(()=>list.forEach(([e])=>{e.style.transition='';e.style.strokeDasharray='';e.style.strokeDashoffset='';e.style.opacity='';e.style.fillOpacity=''}),(total*1.15+.3)*1000)}}
}

function prepare(n){
 [book,cover,base,leaf].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
 pages.querySelectorAll('.tearp').forEach(e=>e.remove());setMask('');charEl.style.display='none';leaf.style.display='none';capEl.style.opacity=0;endEl.style.opacity=0;P.length=0;EM.sparkle=0;EM.fire=null;
 if(n===1){cover.style.display='block';cover.style.transform='rotateY(0deg)';book.style.transform='translateX(-220px)';base.style.clipPath='inset(0 0 0 50%)';L.style.visibility='hidden';L.innerHTML='';R.innerHTML=SV('')}
 else{cover.style.display='none';book.style.transform='translateX(0px)';base.style.clipPath='inset(0 0 0 0%)';L.style.visibility='visible';L.innerHTML=header(n-1);R.innerHTML=PREV[n]();
  if(n===6){setMask('linear-gradient(transparent,transparent)');E.play('F',.5);EM.fire={x:220,y:655,w:860,int:.35}}}
}
function stopAll(){TOK.stopped=true;try{speechSynthesis.cancel()}catch(e){}E.stopAll(.4);EM.sparkle=0;EM.fire=null;capEl.style.opacity=0}
async function run(from){
 stopAll();await new Promise(r=>setTimeout(r,80));
 TOK={stopped:false};$('intro').style.display='none';AC.resume();prepare(from);
 try{for(let n=from;n<=9;n++){$('selScene').value=n;await SC[n]()}await ending()}catch(e){if(e!==CANCEL)console.error(e)}
}
$('selScene').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<option value="${n}">Cena ${String(n).padStart(2,'0')}</option>`).join('');
$('bIntro').onclick=()=>run(1);

$('bStop').onclick=stopAll;
$('vol').oninput=e=>musicBus.gain.value=+e.target.value;
prepare(1);
</script>
